name: Apply School Theme v1

on:
  push:
    branches:
      - design/school-modern-v1
    paths:
      - .github/workflows/apply-school-theme-v1.yml

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: design/school-modern-v1

      - name: Load school theme stylesheet
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          marker = '<link rel="stylesheet" href="school_theme_v1.css">'
          if marker not in s:
              needle = '</head>'
              if needle not in s:
                  raise SystemExit('Closing head tag not found')
              s = s.replace(needle, marker + '\n' + needle, 1)
              p.write_text(s, encoding='utf-8')
          PY

      - name: Validate integration
        shell: bash
        run: |
          grep -q 'school_theme_v1.css' index.html
          test -s school_theme_v1.css

      - name: Commit integration
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No integration change needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "design: load modern school theme"
          git push origin HEAD:design/school-modern-v1
