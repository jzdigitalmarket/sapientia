name: Apply School UI v2
on:
  push:
    branches: [ui/school-modern-v2]
    paths: [.github/workflows/apply-school-ui-v2.yml]
permissions:
  contents: write
jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: ui/school-modern-v2}
      - name: Integrate assets
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html'); s=p.read_text(encoding='utf-8')
          css='<link rel="stylesheet" href="ui_school_modern.css">'
          js='<script src="ui_school_modern.js"></script>'
          if css not in s: s=s.replace('</head>',css+'\n</head>',1)
          if js not in s: s=s.replace('</body>',js+'\n</body>',1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Validate
        run: node --check ui_school_modern.js
      - name: Commit
        shell: bash
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "ui: load modern school theme"
          git push origin HEAD:ui/school-modern-v2
