name: Apply Administração Pública v2

on:
  push:
    branches:
      - content/admin-publica-v2
    paths:
      - .github/workflows/apply-admin-content-v2.yml

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: content/admin-publica-v2

      - name: Load content module before audit module
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          content = '<script src="content_admin_publica_v2.js"></script>'
          audit = '<script src="sapientia_auditoria_patch.js"></script>'
          if content not in s:
              if audit not in s:
                  raise SystemExit('Audit script marker not found')
              s = s.replace(audit, content + '\n' + audit, 1)
              p.write_text(s, encoding='utf-8')
          PY

      - name: Validate JavaScript modules
        run: |
          node --check content_admin_publica_v2.js
          node --check sapientia_auditoria_patch.js

      - name: Commit integration
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No integration change needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "content: load Administração Pública v2 before audit"
          git push origin HEAD:content/admin-publica-v2
