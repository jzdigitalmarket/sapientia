name: Apply Bookstack Enhancement
on:
  push:
    branches: [ui/bookstack-fix]
    paths: [.github/workflows/apply-bookstack.yml]
permissions:
  contents: write
jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ui/bookstack-fix
      - name: Add stylesheet link
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          link='<link rel="stylesheet" href="bookstack_enhancement.css">'
          if link not in s:
              s=s.replace('</head>',link+'\n</head>',1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit
        shell: bash
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "ui: load enhanced hero book stack"
          git push origin HEAD:ui/bookstack-fix
