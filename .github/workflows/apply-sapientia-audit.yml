name: Apply Sapientia audit patch

on:
  push:
    branches:
      - audit/fix-question-bank
    paths:
      - .github/workflows/apply-sapientia-audit.yml

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout audit branch
        uses: actions/checkout@v4
        with:
          ref: audit/fix-question-bank

      - name: Integrate audit module into index
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          marker = '<script src="sapientia_auditoria_patch.js"></script>'
          if marker not in s:
              needle = '</script>\n</body>'
              if needle not in s:
                  raise SystemExit('Expected closing script/body sequence not found')
              s = s.replace(needle, '</script>\n' + marker + '\n</body>', 1)
              p.write_text(s, encoding='utf-8')
          PY

      - name: Validate audit module syntax
        run: node --check sapientia_auditoria_patch.js

      - name: Commit integration
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No integration change needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "audit: load validated question-bank corrections"
          git push origin HEAD:audit/fix-question-bank
